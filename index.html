<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía de compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EDEFF2; --card:#FFFFFF; --ink:#161B26; --muted:#586070; --line:#D6DAE1; --soft:#F5F6F8;
  --accent:#F2C230; --accent-ink:#1A1500; --ok:#1B7447; --warn:#B3261E; --focus:#2457D6;
  --font:'Barlow','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#12151C; --card:#1A1F29; --ink:#ECEFF4; --muted:#9BA4B3; --line:#2D3441; --soft:#212733;
    --ok:#5CC98E; --warn:#FF8F85; --focus:#7FA2FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#12151C; --card:#1A1F29; --ink:#ECEFF4; --muted:#9BA4B3; --line:#2D3441; --soft:#212733;
  --ok:#5CC98E; --warn:#FF8F85; --focus:#7FA2FF; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 96px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(38px,9vw,54px);line-height:1;margin:0 0 6px;letter-spacing:.005em}
.lead{margin:0 0 22px;color:var(--muted);max-width:52ch}

.entry{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--accent);border-radius:6px;padding:16px 16px 18px}
label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.field{width:100%;font:inherit;font-size:20px;font-weight:500;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:12px 14px;min-height:52px}
.field::placeholder{color:var(--muted);font-weight:400}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.field:focus-visible{outline-offset:0}

.feedback{min-height:24px;margin:10px 0 0;font-size:16px}
.feedback .found{display:flex;gap:8px;align-items:baseline;color:var(--ink)}
.feedback .tick{color:var(--ok);font-weight:700;flex:none}
.feedback .found b{font-weight:600}
.feedback .hint{color:var(--muted)}
.feedback .none{color:var(--warn)}

.sug{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.sug[hidden]{display:none}
.sug li{padding:10px 14px;cursor:pointer;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(84px,auto) 1fr;gap:4px 14px;align-items:baseline;min-height:48px}
.sug li:first-child{border-top:0}
.sug li .c{font-weight:600}
.sug li .d{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.sug li[aria-selected="true"],.sug li:hover{background:var(--accent);color:var(--accent-ink)}
.sug li[aria-selected="true"] .d,.sug li:hover .d{color:var(--accent-ink)}

.qtyrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:16px}
.stepper{display:flex;align-items:stretch}
.stepper button{width:48px;min-height:52px;font:inherit;font-size:22px;font-weight:600;color:var(--ink);background:var(--soft);border:1px solid var(--line);cursor:pointer}
.stepper button:first-child{border-radius:5px 0 0 5px}
.stepper button:last-child{border-radius:0 5px 5px 0}
.stepper input{width:84px;text-align:center;border-radius:0;border-left:0;border-right:0;font-family:var(--display);font-size:26px;font-weight:700;padding:6px}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input{-moz-appearance:textfield;appearance:textfield}
.btn-add{flex:1 1 200px;min-height:52px;font:inherit;font-size:18px;font-weight:600;color:var(--accent-ink);background:var(--accent);border:0;border-radius:5px;padding:0 20px;cursor:pointer}
.btn-add:disabled{background:var(--soft);color:var(--muted);cursor:not-allowed;border:1px solid var(--line)}
.btn-add:not(:disabled):active{transform:translateY(1px)}

.listhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin:34px 0 10px}
.listhead h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:0}
.summary{color:var(--muted);font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tool{font:inherit;font-weight:600;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:5px;min-height:44px;padding:0 16px;cursor:pointer}
.tool:disabled{color:var(--muted);cursor:not-allowed;opacity:.6}
.tool.armed{background:var(--warn);border-color:var(--warn);color:#fff}

.sheet{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:14px;color:var(--muted);padding:10px 14px;border-bottom:2px solid var(--ink)}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
.code{font-weight:600;overflow-wrap:anywhere;width:24%}
.desc{overflow-wrap:anywhere}
.nodesc{color:var(--muted);font-style:italic}
.qcell{width:1%;white-space:nowrap}
.qcell .stepper button{width:38px;min-height:42px;font-size:18px}
.qcell .stepper input{width:58px;min-height:42px;font-size:21px;padding:2px}
.xcell{width:1%}
.del{width:44px;height:44px;font-size:24px;line-height:1;color:var(--muted);background:transparent;border:0;border-radius:5px;cursor:pointer}
.del:hover{color:var(--warn);background:var(--soft)}
.empty{padding:30px 18px;color:var(--muted);text-align:center}
tr.flash td{animation:flash 1.1s ease-out}
@keyframes flash{0%{background:var(--accent)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){tr.flash td{animation:none;background:var(--soft)}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.toast[hidden]{display:none}
.toast div{pointer-events:auto;display:flex;gap:16px;align-items:center;background:var(--ink);color:var(--page);padding:12px 16px;border-radius:6px;font-weight:500;max-width:520px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast button{font:inherit;font-weight:600;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px;min-height:36px}

@media (max-width:560px){
  .wrap{padding-top:20px}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table,tbody{display:block}
  tr{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"code qty del" "desc desc desc";align-items:center;padding:10px 6px 12px 14px;gap:4px 6px;border-top:1px solid var(--line)}
  tbody tr:first-child{border-top:0}
  td{display:block;border:0;padding:0}
  td.code{grid-area:code;width:auto;font-size:18px}
  td.qcell{grid-area:qty;width:auto}
  td.xcell{grid-area:del;width:auto}
  td.desc{grid-area:desc;color:var(--muted);font-size:15px;padding-right:8px}
  .desc .nodesc{color:var(--muted)}
}
.pq,.pdate{display:none}

@media print{
  @page{size:auto;margin:14mm 12mm}
  :root,:root[data-theme="dark"]{
    --page:#fff; --card:#fff; --ink:#000; --muted:#444; --line:#bbb; --soft:#fff; color-scheme:light;
    padding:0;
  }
  body{background:#fff !important;color:#000}
  .wrap{padding:0 !important;max-width:none}
  .entry,.lead,.tools,.toast,.xcell,th:last-child,.qcell .stepper,.empty{display:none !important}
  .pq{display:inline;font-weight:700;font-size:16px}
  .pdate{display:block;color:var(--muted);font-size:14px;margin:4px 0 0}
  h1{margin-bottom:0}
  .listhead{margin:16px 0 8px}
  .sheet{border:0;border-radius:0;overflow:visible}
  thead{position:static !important;width:auto !important;height:auto !important;overflow:visible !important;clip:auto !important;display:table-header-group}
  table{display:table !important}
  tbody{display:table-row-group !important}
  tr{display:table-row !important;break-inside:avoid;page-break-inside:avoid}
  td{display:table-cell !important;padding:7px 10px !important;border-top:1px solid var(--line) !important;color:#000 !important;font-size:14px !important}
  th{padding:6px 10px;color:#000}
  .qcell{text-align:center}
  tr.flash td{animation:none !important;background:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Guía de compras</h1>
  <p id="pdate" class="pdate"></p>
  <p class="lead">Escribe un código o una palabra del producto, elige la cantidad y agrégalo a la lista.</p>

  <section class="entry" aria-label="Agregar producto">
    <label for="q">Código o palabra del producto</label>
    <input id="q" class="field" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text"
           placeholder="Ej: LT-5, gancho, filtro"
           role="combobox" aria-expanded="false" aria-controls="sug" aria-autocomplete="list">
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <ul id="sug" class="sug" role="listbox" aria-label="Productos encontrados" hidden></ul>

    <div class="qtyrow">
      <div>
        <label for="qty">Cantidad</label>
        <div class="stepper">
          <button type="button" id="minus" aria-label="Restar una unidad">−</button>
          <input id="qty" class="field" type="number" inputmode="numeric" min="1" max="99999" step="1" value="1">
          <button type="button" id="plus" aria-label="Sumar una unidad">+</button>
        </div>
      </div>
      <button type="button" id="add" class="btn-add" disabled>Agregar a la lista</button>
    </div>
  </section>

  <div class="listhead">
    <h2>Tu lista</h2>
    <span id="summary" class="summary"></span>
  </div>
  <div class="tools">
    <button type="button" id="copy" class="tool">Copiar lista</button>
    <button type="button" id="print" class="tool">Imprimir / Guardar PDF</button>
    <button type="button" id="clear" class="tool">Vaciar lista</button>
  </div>

  <div class="sheet">
    <table>
      <thead><tr><th>Código</th><th>Cantidad</th><th>Descripción</th><th><span class="sr">Quitar</span></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>Todavía no hay productos. Escribe un código arriba y agrégalo.</div>
  </div>
</div>

<div id="toast" class="toast" hidden><div><span id="toastMsg"></span><button type="button" id="toastBtn" hidden>Deshacer</button></div></div>

const strip = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const byCode = new Map();
const index = CATALOG.map(([code, desc]) => {
  const item = { code, desc, kc: strip(code), hay: strip(code + ' ' + desc) };
  byCode.set(item.kc, item);
  return item;
});

const $ = id => document.getElementById(id);
const q = $('q'), qty = $('qty'), addBtn = $('add'), sug = $('sug'), feedback = $('feedback');
const rows = $('rows'), emptyEl = $('empty'), summary = $('summary');
const copyBtn = $('copy'), clearBtn = $('clear'), printBtn = $('print');
const toast = $('toast'), toastMsg = $('toastMsg'), toastBtn = $('toastBtn');

const KEY = 'guia-compras-v1';
let items = [];
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
  if (Array.isArray(raw)) items = raw.filter(x => x && byCode.has(strip(String(x.code))) && x.qty >= 1)
    .map(x => ({ code: byCode.get(strip(String(x.code))).code, qty: Math.floor(x.qty) }));
} catch (e) { items = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} };

let matches = [], active = -1, exact = null, lastRemoved = null, toastTimer = null, armedTimer = null;

function search(text) {
  const tokens = strip(text).split(/\s+/).filter(Boolean);
  if (!tokens.length) return [];
  const full = strip(text).trim();
  const out = [];
  for (const it of index) {
    if (!tokens.every(t => it.hay.includes(t))) continue;
    let score = 3;
    if (it.kc === full) score = 0;
    else if (it.kc.startsWith(full)) score = 1;
    else if (it.kc.includes(full)) score = 2;
    out.push([score, it]);
  }
  out.sort((a, b) => a[0] - b[0] || a[1].kc.localeCompare(b[1].kc, 'es', { numeric: true }));
  return out.slice(0, 8).map(x => x[1]);
}

function setQty(v) {
  let n = Math.floor(Number(v));
  if (!isFinite(n) || n < 1) n = 1;
  if (n > 99999) n = 99999;
  qty.value = n;
  return n;
}

function updateEntry() {
  const v = q.value.trim();
  exact = v ? (byCode.get(strip(v)) || null) : null;
  matches = []; active = -1;
  sug.hidden = true; sug.innerHTML = '';
  q.setAttribute('aria-expanded', 'false');
  q.removeAttribute('aria-activedescendant');
  addBtn.disabled = !exact;

  if (!v) {
    feedback.innerHTML = '<span class="hint">Puedes buscar por código o por parte de la descripción.</span>';
    return;
  }
  if (exact) {
    feedback.innerHTML = '<div class="found"><span class="tick" aria-hidden="true">✓</span><span><b>' + esc(exact.code) + '</b> ' + (exact.desc ? esc(exact.desc) : '<span class="nodesc">Sin descripción en el catálogo</span>') + '</span></div>';
    return;
  }
  matches = search(v);
  if (!matches.length) {
    feedback.innerHTML = '<span class="none">No hay productos con “' + esc(v) + '”. Revisa el código o prueba con otra palabra.</span>';
    return;
  }
  feedback.innerHTML = '<span class="hint">Elige un producto de la lista.</span>';
  sug.innerHTML = matches.map((m, i) =>
    '<li role="option" id="opt' + i + '" data-i="' + i + '" aria-selected="false"><span class="c">' + esc(m.code) + '</span><span class="d">' + (m.desc ? esc(m.desc) : 'Sin descripción') + '</span></li>').join('');
  sug.hidden = false;
  q.setAttribute('aria-expanded', 'true');
}

function highlight(i) {
  const opts = sug.querySelectorAll('li');
  opts.forEach((o, k) => o.setAttribute('aria-selected', k === i ? 'true' : 'false'));
  active = i;
  if (i >= 0) { q.setAttribute('aria-activedescendant', 'opt' + i); opts[i].scrollIntoView({ block: 'nearest' }); }
  else q.removeAttribute('aria-activedescendant');
}

function pick(m) {
  q.value = m.code;
  updateEntry();
  qty.focus(); qty.select();
}

function addCurrent() {
  if (!exact) return;
  const n = setQty(qty.value);
  const found = items.find(x => x.code === exact.code);
  let flashCode = exact.code;
  if (found) { found.qty = Math.min(99999, found.qty + n); showToast('Ya estaba en la lista: ahora son ' + found.qty + ' unidades de ' + exact.code + '.'); }
  else { items.unshift({ code: exact.code, qty: n }); showToast('Agregado: ' + n + ' × ' + exact.code + '.'); }
  save(); render(flashCode);
  q.value = ''; setQty(1); updateEntry(); q.focus();
}

function render(flashCode) {
  rows.innerHTML = items.map(it => {
    const p = byCode.get(strip(it.code));
    return '<tr data-code="' + esc(it.code) + '">' +
      '<td class="code">' + esc(it.code) + '</td>' +
      '<td class="qcell"><span class="pq">' + it.qty + '</span><div class="stepper">' +
        '<button type="button" data-act="dec" aria-label="Restar una unidad de ' + esc(it.code) + '">−</button>' +
        '<input class="field" type="number" inputmode="numeric" min="1" max="99999" value="' + it.qty + '" aria-label="Cantidad de ' + esc(it.code) + '">' +
        '<button type="button" data-act="inc" aria-label="Sumar una unidad de ' + esc(it.code) + '">+</button>' +
      '</div></td>' +
      '<td class="desc">' + (p && p.desc ? esc(p.desc) : '<span class="nodesc">Sin descripción en el catálogo</span>') + '</td>' +
      '<td class="xcell"><button type="button" class="del" data-act="del" aria-label="Quitar ' + esc(it.code) + ' de la lista">×</button></td>' +
      '</tr>';
  }).join('');
  emptyEl.hidden = items.length > 0;
  copyBtn.disabled = clearBtn.disabled = printBtn.disabled = items.length === 0;
  const units = items.reduce((a, x) => a + x.qty, 0);
  summary.textContent = items.length
    ? items.length + (items.length === 1 ? ' producto, ' : ' productos, ') + units + (units === 1 ? ' unidad' : ' unidades')
    : '';
  if (flashCode) {
    const tr = [...rows.children].find(r => r.dataset.code === flashCode);
    if (tr) tr.classList.add('flash');
  }
}

function showToast(msg, undo) {
  toastMsg.textContent = msg;
  toastBtn.hidden = !undo;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; lastRemoved = null; }, undo ? 6000 : 3000);
}

rows.addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const tr = btn.closest('tr');
  const i = items.findIndex(x => x.code === tr.dataset.code);
  if (i < 0) return;
  const act = btn.dataset.act;
  if (act === 'del') {
    lastRemoved = { item: items[i], index: i };
    items.splice(i, 1); save(); render();
    showToast('Quitaste ' + lastRemoved.item.code + '.', true);
  } else {
    items[i].qty = Math.max(1, Math.min(99999, items[i].qty + (act === 'inc' ? 1 : -1)));
    save(); render();
    const again = [...rows.children].find(r => r.dataset.code === items[i].code);
    const b = again && again.querySelector('button[data-act="' + act + '"]');
    if (b) b.focus();
  }
});
rows.addEventListener('change', e => {
  if (e.target.tagName !== 'INPUT') return;
  const tr = e.target.closest('tr');
  const it = items.find(x => x.code === tr.dataset.code);
  if (!it) return;
  let n = Math.floor(Number(e.target.value));
  if (!isFinite(n) || n < 1) n = 1;
  it.qty = Math.min(99999, n); save(); render();
});
rows.addEventListener('animationend', e => e.target.parentElement && e.target.parentElement.classList.remove('flash'));

toastBtn.addEventListener('click', () => {
  if (!lastRemoved) return;
  const { item, index: at } = lastRemoved;
  items.splice(Math.min(at, items.length), 0, item);
  lastRemoved = null; save(); render(item.code); toast.hidden = true;
});

q.addEventListener('input', updateEntry);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && matches.length) { e.preventDefault(); highlight((active + 1) % matches.length); }
  else if (e.key === 'ArrowUp' && matches.length) { e.preventDefault(); highlight((active - 1 + matches.length) % matches.length); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (exact) { qty.focus(); qty.select(); }
    else if (matches.length) pick(matches[active >= 0 ? active : 0]);
  } else if (e.key === 'Escape') { sug.hidden = true; q.setAttribute('aria-expanded', 'false'); }
});
sug.addEventListener('mousedown', e => e.preventDefault());
sug.addEventListener('click', e => {
  const li = e.target.closest('li[data-i]');
  if (li) pick(matches[Number(li.dataset.i)]);
});

$('minus').addEventListener('click', () => setQty(Number(qty.value) - 1));
$('plus').addEventListener('click', () => setQty(Number(qty.value) + 1));
qty.addEventListener('change', () => setQty(qty.value));
qty.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); setQty(qty.value); addCurrent(); } });
addBtn.addEventListener('click', addCurrent);

copyBtn.addEventListener('click', async () => {
  if (!items.length) return;
  const lines = ['Código\tCantidad\tDescripción'].concat(items.map(it => {
    const p = byCode.get(strip(it.code));
    return it.code + '\t' + it.qty + '\t' + (p ? p.desc : '');
  }));
  const text = lines.join('\n');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); document.body.removeChild(ta);
    } catch (e) {}
  }
  showToast(ok ? 'Lista copiada. Pégala en Excel, WhatsApp o un correo.' : 'No se pudo copiar. Selecciona la tabla y cópiala a mano.');
});

clearBtn.addEventListener('click', () => {
  if (!items.length) return;
  if (!clearBtn.classList.contains('armed')) {
    clearBtn.classList.add('armed'); clearBtn.textContent = 'Toca otra vez para vaciar';
    armedTimer = setTimeout(disarm, 3500);
    return;
  }
  disarm(); items = []; save(); render(); showToast('Lista vaciada.');
});
function disarm() { clearTimeout(armedTimer); clearBtn.classList.remove('armed'); clearBtn.textContent = 'Vaciar lista'; }

printBtn.addEventListener('click', () => {
  if (!items.length) return;
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  $('pdate').textContent = 'Fecha: ' + now.toLocaleDateString('es', { day: 'numeric', month: 'long', year: 'numeric' }) +
    ' · ' + now.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  const prevTitle = document.title;
  document.title = 'Guia-de-compras-' + now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  const restore = () => { document.title = prevTitle; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  toast.hidden = true;
  window.print();
});

setQty(1); updateEntry(); render();
</script>
</body>
</html>
